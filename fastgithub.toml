# FastGithub 配置。字段语义见 docs/specs/2026-10-20-fastgithub-go-design.md §6.3。

[server]
proxy_port = 38457
ui_port    = 38470
singleton  = true
# 被接管域名是否使用 HTTP/2（浏览器 ↔ 代理 ↔ 上游）；false 时回退到 v0.3.6 的 h1.1 行为。
http2      = true

[server.transparent]
https = 443
http  = 80
ssh   = 22
git   = 9418

[dns]
doh      = ["https://doh.pub/dns-query", "https://dns.alidns.com/dns-query"]
fallback = ["8.8.8.8:53", "119.29.29.29:53", "114.114.114.114:53"]
timeout  = "4s"

[intercept]
mode       = "auto"
driver_dir = ""

[log]
level = "info"
file  = "logs/fastgithub.log"

# 备用 IP：DNS 只返回不可达 IP 时参与 TCP 竞速。内置了 github.com、api.github.com、
# codeload.github.com 的默认值；需要覆盖时取消注释。键必须是精确域名，不支持通配。
# [fallback_ips]
# "github.com" = ["140.82.113.3", "140.82.114.3"]
