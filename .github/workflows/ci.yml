name: ci

permissions:
  contents: write

on:
  push:
    branches-ignore:
      - 'ci-log-*'
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: go test
        shell: bash
        run: |
          set +e
          go test ./... 2>&1 | tee go-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## go test failed on ${{ matrix.os }}"
              echo '```'
              tail -200 go-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            branch="ci-log-${GITHUB_RUN_ID}-${{ matrix.os }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B "$branch"
            git add -f go-test.log
            git commit -m "ci: test log ${GITHUB_RUN_ID} ${{ matrix.os }}"
            git push origin "HEAD:$branch"
          fi
          exit "$status"
      - name: go vet
        run: go vet ./...
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: cross build
        run: bash scripts/ci.sh
